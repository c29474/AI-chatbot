<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' http://localhost:8002; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' http://localhost:8002 data:; frame-src 'self' http://localhost:8002;">
    <meta name="referrer" content="no-referrer-when-downgrade">
    <title id="pageTitle">创意写作助手 - AI聊天机器人</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">
            <div class="chat-controls">
                <button class="chat-control-btn" onclick="newConversation()" id="newChatBtn"></button>
                <button class="chat-control-btn" onclick="clearConversation()" id="clearChatBtn"></button>
                <button class="chat-control-btn save-chat-btn" onclick="saveChatHistory()" id="saveChatBtn"></button>
            </div>
            <h1 id="title"></h1>
            <p id="subtitle"></p>
            <div class="language-switch">
                <select id="lang" onchange="switchLanguage()">
                    <option value="zh">中文</option>
                    <option value="ru">Русский</option>
                </select>
            </div>
            <div class="sidebar-toggle">
                <button class="chat-control-btn" onclick="toggleSidebar()" id="sidebarToggleBtn"></button>
            </div>
        </div>
        
        <div class="main-container">
            <div class="chat-area">
                <div class="quick-actions" id="quickActions">
                    <!-- 快速操作按钮将通过JavaScript动态生成 -->
                </div>
                
                <div class="preset-buttons" id="presetButtons">
                    <!-- 预设角色按钮将通过JavaScript动态生成 -->
                </div>
                
                <div class="chat-messages" id="chatMessages">
                    <div class="message bot">
                        <div class="message-content" id="welcomeContent">
                            <!-- 欢迎消息将通过JavaScript动态生成 -->
                        </div>
                    </div>
                </div>
                
                <div class="chat-input">
                    <input type="text" id="messageInput" placeholder="" onkeypress="handleKeyPress(event)">
                    <button onclick="sendMessage()" id="sendBtn"></button>
                    <button onclick="stopGeneration()" id="stopBtn" class="stop-btn"></button>
                </div>
            </div>
            
            <div class="sidebar" id="sidebar">
                <div class="character-form" id="characterForm">
                    <!-- 角色生成表单将通过JavaScript动态生成 -->
                </div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
